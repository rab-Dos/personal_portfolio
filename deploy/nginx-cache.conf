# Add this map inside nginx's http {} block.
# It preserves the server's existing root/alias and routing configuration.
map $uri $portfolio_cache_control {
    default "";
    ~^/jesusarellano/_astro/ "public, max-age=31536000, immutable";
    ~^/jesusarellano/(images|media)/ "public, max-age=604800";
    ~^/jesusarellano/scripts/ "public, max-age=3600";
    ~^/jesusarellano/($|index\.html$|.*\.xml$|site\.webmanifest$) "no-cache";
}

# Add the following directive inside the serving server {} block (or its
# existing location blocks if they already declare their own add_header):
# add_header Cache-Control $portfolio_cache_control;
